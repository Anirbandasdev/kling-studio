# Builds all distributables in the cloud, so you don't need a Mac.
# Re-index trigger: touch this file if the workflow doesn't appear under Actions.
# Put this repo on GitHub, then: Actions tab -> "Build apps" -> Run workflow.
# Afterwards download from the run's Artifacts section and send to coworkers:
#   "Kling-Studio-Windows"  ->  Setup .exe (Start Menu, uninstaller)
#   "Kling-Studio-Mac"      ->  .dmg installer + .app.zip (either works)
#
# Assumes the repo root IS the v2 folder (app.py, build_exe.bat next to .github/).
# If your repo root is the parent folder instead, move this file up to
# <root>/.github/workflows/build.yml and add `working-directory: v2` to each run step.

name: Build apps

on:
  workflow_dispatch:  # manual Run button
  push:
    tags: ["v*"]      # also auto-builds when you push a tag like v2.3.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: .\build_exe.bat
      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
      - name: Compile installer
        # winget installs machine-wide on CI runners but per-user on some PCs: check both
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                    "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
                    "C:\Program Files\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          Write-Host "Using $iscc"
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Kling-Studio-Windows
          path: dist/Kling Studio Setup *.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyinstaller pillow
      - run: python3 tools/make_icon.py
      - run: python3 tools/make_mac_icon.py
      - run: sh build_mac.sh
      - run: ditto -c -k --keepParent "dist/Kling Studio.app" "dist/Kling Studio-mac.zip"
      - name: Build drag-to-Applications .dmg
        run: |
          rm -rf dmg-root && mkdir dmg-root
          cp -R "dist/Kling Studio.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Kling Studio" -srcfolder dmg-root -ov -format UDZO "dist/Kling Studio-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Kling-Studio-Mac
          path: |
            dist/Kling Studio-mac.dmg
            dist/Kling Studio-mac.zip
